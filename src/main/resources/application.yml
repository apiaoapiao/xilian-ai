#      chat:
#        options:
#          model: qwen-plus
#          temperature: 0.5
#      api-key: ${DASHSCOPE_API_KEY}
    deepseek:
      # 不要把 key 写死在这里：本地放 application-local.yml（已 gitignore），或设置环境变量
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-flash
          temperature: 0.5
